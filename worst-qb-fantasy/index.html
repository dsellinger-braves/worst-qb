<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst QB Fantasy Football</title>
    <meta name="description" content="A custom fantasy football game where you draft the worst QBs and bad plays are good points.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Entry -->
    <script type="module" src="js/app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="glass-nav">
            <div class="nav-brand">
                <span class="brand-text">WORST<span class="brand-highlight">QB</span></span>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link" data-route="dashboard">Dashboard</a>
                <a href="#" class="nav-link" data-route="leagues">Leagues</a>
                <a href="#" class="nav-link" data-route="draft">Draft Room</a>
                <a href="#" class="nav-link" data-route="matchups">Live Scores</a>
            </div>
            <div class="nav-user">
                <button id="auth-btn" class="btn btn-primary">Login</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="app-content">
            <!-- Dynamic content injected here by router -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading the gridiron...</p>
            </div>
        </main>
    </div>
</body>
</html>
