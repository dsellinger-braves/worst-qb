<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst QB Fantasy Football</title>
    <meta name="description" content="A custom fantasy football game where you draft the worst QBs and bad plays are good points.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Entry -->
    <script type="module" src="js/app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Global Navigation Bar -->
        <nav class="glass-nav" id="global-nav">
            <div class="nav-brand">
                <span class="brand-text">WORST<span class="brand-highlight">QB</span></span>
            </div>
            <div class="nav-links">
                <a href="#/dashboard" class="nav-link">My Leagues</a>
                <a href="#/rules" class="nav-link">Rules</a>
                <!-- These will be useful for viewing general non-league data -->
                <a href="#/projections" class="nav-link">Global Projections</a>
                <a href="#/stats" class="nav-link">Global Stats</a>
                <a href="#/settings" class="nav-link" id="nav-settings" style="display: none;">Settings</a>
            </div>
            <div class="nav-user">
                <button id="auth-btn" class="btn btn-primary">Login</button>
            </div>
        </nav>

        <!-- League Context Sub-Navigation (Hidden by default) -->
        <nav class="glass-nav" id="league-nav" style="display: none; background: rgba(0,0,0,0.6); border-top: none; padding: 0.5rem 2rem;">
            <div class="nav-links" style="font-size: 0.9rem;" id="league-nav-links">
                <a href="#/league_detail" class="nav-link" id="ln-home">League Home</a>
                <a href="#/draft" class="nav-link" id="ln-draft">Draft Room</a>
                <a href="#/matchups" class="nav-link" id="ln-matchups">Matchups</a>
                <a href="#/projections" class="nav-link" id="ln-proj">League Projections</a>
                <a href="#/stats" class="nav-link" id="ln-stats">League Stats</a>
            </div>
            <div class="nav-user" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-primary);" id="league-nav-name">
                League Name
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="app-content">
            <!-- Dynamic content injected here by router -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading the gridiron...</p>
            </div>
        </main>

        <!-- Auth Modal -->
        <div id="auth-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: rgba(20, 20, 25, 0.95); border: 1px solid var(--glass-border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <h2 id="auth-title" style="margin-bottom: 1.5rem; color: var(--accent-primary);">Login</h2>
                <form id="auth-form" onsubmit="event.preventDefault();">
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Email</label>
                        <input type="email" id="auth-email" required style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 6px; color: white;">
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Password</label>
                        <input type="password" id="auth-password" required minlength="6" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 6px; color: white;">
                    </div>
                    <div id="auth-opt-in-container" style="display: none; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="auth-opt-in" checked>
                            Send me weekly recap emails
                        </label>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</button>
                        <div style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
                            <span id="auth-switch-text">Don't have an account?</span>
                            <a href="#" id="auth-switch-mode" style="color: var(--accent-primary); text-decoration: none;">Sign up</a>
                        </div>
                    </div>
                </form>
                <button id="auth-close-btn" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
        </div>
    </div>
</body>
</html>
